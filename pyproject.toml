[project]
name = "email_triage"
version = "0.1.0"
description = "email_triage using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.23,<2.0.0"
]

[project.scripts]
kickoff = "email_triage.main:kickoff"
run_crew = "email_triage.main:kickoff"
plot = "email_triage.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "1bbcf7b3-2eff-4e3f-9ade-d8b71122e2f4"
